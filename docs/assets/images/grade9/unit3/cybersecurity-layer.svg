<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold">Layers of Cybersecurity</text>

<g font-family="Arial">
<rect x="650" y="690" width="300" height="90" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="800" y="742" text-anchor="middle" font-size="24" font-weight="bold">Data</text>

<polygon points="600,650 1000,650 950,580 650,580" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="800" y="620" text-anchor="middle" font-size="22" font-weight="bold">Applications</text>

<polygon points="550,550 1050,550 980,470 620,470" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="800" y="515" text-anchor="middle" font-size="22" font-weight="bold">Operating System</text>

<polygon points="500,440 1100,440 1010,350 590,350" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="800" y="400" text-anchor="middle" font-size="22" font-weight="bold">Network Security</text>

<polygon points="450,320 1150,320 1040,220 560,220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="800" y="280" text-anchor="middle" font-size="22" font-weight="bold">Physical Security & Users</text>

<rect x="90" y="180" width="280" height="520" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="110" y="220" font-size="22" font-weight="bold">Examples</text>
<text x="110" y="265" font-size="18">• Strong passwords</text>
<text x="110" y="305" font-size="18">• Multi-factor authentication</text>
<text x="110" y="345" font-size="18">• Firewalls</text>
<text x="110" y="385" font-size="18">• Antivirus software</text>
<text x="110" y="425" font-size="18">• Software updates</text>
<text x="110" y="465" font-size="18">• Encryption</text>
<text x="110" y="505" font-size="18">• Physical locks</text>
<text x="110" y="545" font-size="18">• Security awareness</text>

<text x="800" y="845" text-anchor="middle" font-size="18">
Cybersecurity uses multiple layers of protection. If one layer fails, others continue protecting the system.
</text>
</g>
</svg>
