<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
text{font-family:Arial,sans-serif}
.title{font-size:36px;font-weight:bold;fill:#0f172a}
.head{font-size:22px;font-weight:bold}
.body{font-size:17px}
.host{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:12}
.router{fill:#fef3c7;stroke:#d97706;stroke-width:2}
.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:10}
</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="title">IP Routing</text>

<rect x="70" y="360" width="180" height="90" class="host"/>
<text x="160" y="395" text-anchor="middle" class="head">Laptop</text>
<text x="160" y="425" text-anchor="middle" class="body">192.168.1.25</text>

<circle cx="420" cy="405" r="55" class="router"/>
<text x="420" y="412" text-anchor="middle" class="head">R1</text>

<circle cx="760" cy="405" r="55" class="router"/>
<text x="760" y="412" text-anchor="middle" class="head">R2</text>

<circle cx="1100" cy="405" r="55" class="router"/>
<text x="1100" y="412" text-anchor="middle" class="head">R3</text>

<rect x="1330" y="360" width="200" height="90" class="host"/>
<text x="1430" y="395" text-anchor="middle" class="head">Web Server</text>
<text x="1430" y="425" text-anchor="middle" class="body">203.0.113.10</text>

<line x1="250" y1="405" x2="365" y2="405" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/>
<line x1="475" y1="405" x2="705" y2="405" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/>
<line x1="815" y1="405" x2="1045" y2="405" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/>
<line x1="1155" y1="405" x2="1330" y2="405" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/>

<text x="300" y="385" class="body">Packet</text>
<text x="590" y="385" class="body">Forward</text>
<text x="930" y="385" class="body">Forward</text>
<text x="1230" y="385" class="body">Deliver</text>

<rect x="120" y="560" width="1360" height="220" class="note"/>
<text x="145" y="600" class="head">How IP Routing Works</text>
<text x="145" y="640" class="body">1. The sender creates a packet with the destination IP address.</text>
<text x="145" y="675" class="body">2. Each router examines the destination IP address.</text>
<text x="145" y="710" class="body">3. The router forwards the packet to the next best path.</text>
<text x="145" y="745" class="body">4. The destination server receives the packet.</text>

<text x="800" y="850" text-anchor="middle" class="body">IP chooses the path. TCP is responsible for reliable delivery.</text>
</svg>
