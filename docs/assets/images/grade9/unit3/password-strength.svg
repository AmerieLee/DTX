<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold">Password Strength</text><rect x="80" y="120" width="1440" height="120" fill="#f8fafc" stroke="#94a3b8"/><text x="110" y="170" font-family="Arial" font-size="22" font-weight="bold">Strong Password Checklist</text><text x="110" y="210" font-family="Arial" font-size="18">12+ characters • Uppercase • Lowercase • Numbers • Symbols • Unique</text><rect x="100" y="300" width="620" height="420" fill="#fef2f2" stroke="#dc2626"/><text x="410" y="350" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Weak Passwords</text><text x="140" y="410" font-family="Arial" font-size="18">123456</text><text x="140" y="450" font-family="Arial" font-size="18">password</text><text x="140" y="490" font-family="Arial" font-size="18">abc123</text><text x="140" y="560" font-family="Arial" font-size="18">Easy to guess</text><rect x="880" y="300" width="620" height="420" fill="#ecfdf5" stroke="#16a34a"/><text x="1190" y="350" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Strong Password</text><text x="930" y="410" font-family="Arial" font-size="18">Blue!River27$Forest</text><text x="930" y="470" font-family="Arial" font-size="18">Long, unique and difficult to guess</text><rect x="120" y="790" width="1360" height="55" fill="#eef6ff" stroke="#2563eb"/><text x="800" y="825" text-anchor="middle" font-family="Arial" font-size="18">Use a password manager and enable MFA whenever possible.</text></svg>