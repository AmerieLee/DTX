<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,sans-serif}
.t{font-size:34px;font-weight:bold}
.h{font-size:22px;font-weight:bold}
.b{font-size:17px}
.box{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:12}
</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="t">Encryption Process</text>
<rect class="box" x="90" y="260" width="240" height="120"/>
<text x="210" y="315" text-anchor="middle" class="h">Plain Text</text>
<text x="210" y="345" text-anchor="middle" class="b">Hello World</text>
<line x1="330" y1="320" x2="500" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/>
<rect class="box" x="500" y="240" width="280" height="160"/>
<text x="640" y="290" text-anchor="middle" class="h">Encryption</text>
<text x="640" y="325" text-anchor="middle" class="b">Secret Key</text>
<text x="640" y="355" text-anchor="middle" class="b">Encryption Algorithm</text>
<line x1="780" y1="320" x2="980" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/>
<rect class="box" x="980" y="260" width="260" height="120"/>
<text x="1110" y="315" text-anchor="middle" class="h">Ciphertext</text>
<text x="1110" y="345" text-anchor="middle" class="b">8F#A2@X!...</text>
<line x1="1240" y1="320" x2="1410" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/>
<rect class="box" x="1410" y="240" width="150" height="160"/>
<text x="1485" y="290" text-anchor="middle" class="h">Receiver</text>
<text x="1485" y="325" text-anchor="middle" class="b">Decrypt</text>
<rect x="120" y="520" width="1360" height="220" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="150" y="565" class="h">How Encryption Works</text>
<text x="150" y="605" class="b">1. Plain text is the original readable message.</text>
<text x="150" y="640" class="b">2. An encryption algorithm and key scramble the data.</text>
<text x="150" y="675" class="b">3. Ciphertext is unreadable without the correct key.</text>
<text x="150" y="710" class="b">4. The receiver decrypts the ciphertext to recover the original message.</text>
</svg>