site_name: DTX
site_description: Digital Technology Interactive Textbook
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
nav:
  - Home: index.md
  - Grade 9:
      - Unit 3 (Digital Tech):
          - Lesson 1 Overview: grade9/unit3/lesson1/index.md
          - AI Introduction: grade9/unit3/lesson1/ai.md
          - Python Programming: grade9/unit3/lesson1/python.md
