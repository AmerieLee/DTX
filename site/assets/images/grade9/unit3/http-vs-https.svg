<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,sans-serif}
.t{font-size:36px;font-weight:bold;fill:#111827}
.h{font-size:24px;font-weight:bold}
.b{font-size:18px}
.box{stroke-width:2;rx:14}
</style></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="60" text-anchor="middle" class="t">HTTP vs HTTPS</text>

<rect x="80" y="130" width="660" height="650" class="box" fill="#fef2f2" stroke="#dc2626"/>
<text x="410" y="180" text-anchor="middle" class="h">HTTP</text>
<text x="410" y="220" text-anchor="middle" class="b">HyperText Transfer Protocol</text>

<rect x="860" y="130" width="660" height="650" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="1190" y="180" text-anchor="middle" class="h">HTTPS</text>
<text x="1190" y="220" text-anchor="middle" class="b">HyperText Transfer Protocol Secure</text>

<text x="130" y="290" class="h">Characteristics</text>
<text x="130" y="330" class="b">• No encryption</text>
<text x="130" y="365" class="b">• Data can be intercepted</text>
<text x="130" y="400" class="b">• Suitable for public information</text>
<text x="130" y="435" class="b">• URL starts with http://</text>

<text x="910" y="290" class="h">Characteristics</text>
<text x="910" y="330" class="b">• Encrypted communication</text>
<text x="910" y="365" class="b">• Protects passwords and personal data</text>
<text x="910" y="400" class="b">• Used for banking and shopping</text>
<text x="910" y="435" class="b">• URL starts with https://</text>

<text x="410" y="560" font-size="72" text-anchor="middle">🔓</text>
<text x="1190" y="560" font-size="72" text-anchor="middle">🔒</text>

<text x="410" y="650" text-anchor="middle" class="h">Less Secure</text>
<text x="1190" y="650" text-anchor="middle" class="h">More Secure</text>

<rect x="350" y="810" width="900" height="50" fill="#eef2ff" stroke="#6366f1"/>
<text x="800" y="842" text-anchor="middle" class="b">HTTPS uses encryption to protect data while it travels across the Internet.</text>
</svg>