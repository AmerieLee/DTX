<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,sans-serif}
.t{font-size:34px;font-weight:bold}
.h{font-size:22px;font-weight:bold}
.b{font-size:18px}
.box{fill:#eef6ff;stroke:#2563eb;stroke-width:2}
.ai{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}
.line{stroke:#64748b;stroke-width:3}
</style></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="t">AI Network Management</text>

<rect x="650" y="120" width="300" height="140" rx="12" class="ai"/>
<text x="800" y="180" text-anchor="middle" class="h">AI Controller</text>
<text x="800" y="215" text-anchor="middle" class="b">Machine Learning</text>

<rect x="140" y="380" width="250" height="120" rx="10" class="box"/>
<text x="265" y="445" text-anchor="middle" class="h">Router</text>

<rect x="500" y="380" width="250" height="120" rx="10" class="box"/>
<text x="625" y="445" text-anchor="middle" class="h">Switch</text>

<rect x="860" y="380" width="250" height="120" rx="10" class="box"/>
<text x="985" y="445" text-anchor="middle" class="h">Firewall</text>

<rect x="1220" y="380" width="250" height="120" rx="10" class="box"/>
<text x="1345" y="445" text-anchor="middle" class="h">Servers</text>

<line x1="800" y1="260" x2="265" y2="380" class="line"/>
<line x1="800" y1="260" x2="625" y2="380" class="line"/>
<line x1="800" y1="260" x2="985" y2="380" class="line"/>
<line x1="800" y1="260" x2="1345" y2="380" class="line"/>

<rect x="100" y="610" width="1400" height="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="140" y="655" class="h">How AI Helps Networks</text>
<text x="140" y="700" class="b">• Detects unusual traffic and cyber attacks automatically.</text>
<text x="140" y="735" class="b">• Predicts equipment failures before they happen.</text>
<text x="140" y="770" class="b">• Optimises traffic to improve speed and reliability.</text>
</svg>