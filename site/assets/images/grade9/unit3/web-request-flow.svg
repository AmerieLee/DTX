<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,sans-serif}.t{font-size:34px;font-weight:bold}.h{font-size:20px;font-weight:bold}.b{font-size:16px}
.box{fill:#eef6ff;stroke:#2563eb;stroke-width:2}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect width="1600" height="900" fill="white"/>
<text x="800" y="50" text-anchor="middle" class="t">Web Request Flow</text>
<rect class="box" x="60" y="180" width="170" height="90"/><text x="145" y="212" text-anchor="middle" class="h">User</text><text x="145" y="240" text-anchor="middle" class="b">Enter URL</text><line x1="230" y1="225" x2="280" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="280" y="180" width="170" height="90"/><text x="365" y="212" text-anchor="middle" class="h">DNS</text><text x="365" y="240" text-anchor="middle" class="b">Find IP</text><line x1="450" y1="225" x2="500" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="500" y="180" width="170" height="90"/><text x="585" y="212" text-anchor="middle" class="h">IP</text><text x="585" y="240" text-anchor="middle" class="b">Route</text><line x1="670" y1="225" x2="720" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="720" y="180" width="170" height="90"/><text x="805" y="212" text-anchor="middle" class="h">TCP</text><text x="805" y="240" text-anchor="middle" class="b">Reliable</text><line x1="890" y1="225" x2="940" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="940" y="180" width="170" height="90"/><text x="1025" y="212" text-anchor="middle" class="h">HTTP/HTTPS</text><text x="1025" y="240" text-anchor="middle" class="b">Request</text><line x1="1110" y1="225" x2="1160" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="1160" y="180" width="170" height="90"/><text x="1245" y="212" text-anchor="middle" class="h">Server</text><text x="1245" y="240" text-anchor="middle" class="b">Respond</text><line x1="1330" y1="225" x2="1380" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="1380" y="180" width="170" height="90"/><text x="1465" y="212" text-anchor="middle" class="h">Browser</text><text x="1465" y="240" text-anchor="middle" class="b">Display</text>
<rect class="note" x="100" y="420" width="1400" height="260"/>
<text x="130" y="460" class="h">Process</text>
<text x="130" y="500" class="b">1. User enters a URL.</text>
<text x="130" y="535" class="b">2. DNS finds the server IP address.</text>
<text x="130" y="570" class="b">3. IP routes packets.</text>
<text x="130" y="605" class="b">4. TCP ensures reliable delivery.</text>
<text x="130" y="640" class="b">5. HTTP/HTTPS transfers the webpage.</text>
</svg>