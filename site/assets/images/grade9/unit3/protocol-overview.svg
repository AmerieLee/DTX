<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.title{font:700 36px Arial;fill:#1f2937}.h{font:700 22px Arial}.b{font:16px Arial}.s{font:14px Arial;fill:#555}.box{fill:#eef6ff;stroke:#3b82f6;stroke-width:2;rx:14}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="800" y="60" text-anchor="middle" class="title">Network Protocol Overview</text><rect class="box" x="70" y="170" width="220" height="120"/><text x="180" y="210" text-anchor="middle" class="h">User</text><text x="180" y="245" text-anchor="middle" class="b">Type URL</text><rect class="box" x="360" y="170" width="220" height="120"/><text x="470" y="210" text-anchor="middle" class="h">DNS</text><text x="470" y="245" text-anchor="middle" class="b">Find IP</text><rect class="box" x="650" y="170" width="220" height="120"/><text x="760" y="210" text-anchor="middle" class="h">IP</text><text x="760" y="245" text-anchor="middle" class="b">Route Packets</text><rect class="box" x="940" y="170" width="220" height="120"/><text x="1050" y="210" text-anchor="middle" class="h">TCP</text><text x="1050" y="245" text-anchor="middle" class="b">Reliable Delivery</text><rect class="box" x="1230" y="170" width="260" height="120"/><text x="1360" y="210" text-anchor="middle" class="h">HTTP / HTTPS</text><text x="1360" y="245" text-anchor="middle" class="b">Transfer Webpage</text><line x1="290" y1="230" x2="360" y2="230" stroke="#666" stroke-width="3" marker-end="url(#m)"/><line x1="580" y1="230" x2="650" y2="230" stroke="#666" stroke-width="3" marker-end="url(#m)"/><line x1="870" y1="230" x2="940" y2="230" stroke="#666" stroke-width="3" marker-end="url(#m)"/><line x1="1160" y1="230" x2="1230" y2="230" stroke="#666" stroke-width="3" marker-end="url(#m)"/><rect class="box" x="330" y="450" width="940" height="280"/><text x="800" y="500" text-anchor="middle" class="h">Protocol Summary</text><text x="380" y="550" class="b">• DNS: Converts a domain name to an IP address.</text><text x="380" y="590" class="b">• IP: Finds the destination and routes packets.</text><text x="380" y="630" class="b">• TCP: Delivers packets reliably and in order.</text><text x="380" y="670" class="b">• HTTP: Transfers webpages.</text><text x="380" y="710" class="b">• HTTPS: Encrypts communication.</text></svg>