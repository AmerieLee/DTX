<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2563eb"/></marker>
<style>
text{font-family:Arial,sans-serif}
.t{font-size:36px;font-weight:bold;fill:#0f172a}
.h{font-size:22px;font-weight:bold}
.b{font-size:17px}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}
</style></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="t">TCP Reliable Delivery</text>
<text x="220" y="110" class="h">Sender</text>
<text x="1320" y="110" class="h">Receiver</text>
<line x1="250" y1="140" x2="250" y2="760" stroke="#333" stroke-width="3"/>
<line x1="1350" y1="140" x2="1350" y2="760" stroke="#333" stroke-width="3"/>
<text x="230" y="790" class="b">Time ↓</text>
<text x="1330" y="790" class="b">Time ↓</text>

<line x1="260" y1="190" x2="1340" y2="190" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
<text x="700" y="175" class="b">Packet 1 (Seq=1)</text>
<line x1="1340" y1="240" x2="260" y2="240" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="760" y="230" class="b">ACK 1</text>

<line x1="260" y1="320" x2="1340" y2="320" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
<text x="700" y="305" class="b">Packet 2 (Seq=2)</text>
<line x1="1340" y1="370" x2="260" y2="370" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="760" y="360" class="b">ACK 2</text>

<line x1="260" y1="450" x2="1240" y2="450" stroke="#ea580c" stroke-width="4" marker-end="url(#a)"/>
<text x="700" y="435" class="b">Packet 3 (Seq=3)</text>
<text x="1265" y="465" fill="#dc2626" font-size="28">✖ Lost</text>

<rect x="520" y="500" width="560" height="60" class="box"/>
<text x="800" y="537" text-anchor="middle" class="b">Timeout waiting for ACK 3</text>

<line x1="260" y1="620" x2="1340" y2="620" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<text x="620" y="605" class="b">Resend Packet 3</text>
<line x1="1340" y1="670" x2="260" y2="670" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="760" y="660" class="b">ACK 3</text>

<rect x="60" y="120" width="150" height="620" class="box"/>
<text x="75" y="155" class="h">Steps</text>
<text x="75" y="190" class="b">1. Send P1</text>
<text x="75" y="225" class="b">2. ACK 1</text>
<text x="75" y="260" class="b">3. Send P2</text>
<text x="75" y="295" class="b">4. ACK 2</text>
<text x="75" y="330" class="b">5. Send P3</text>
<text x="75" y="365" class="b">6. Lost</text>
<text x="75" y="400" class="b">7. Timeout</text>
<text x="75" y="435" class="b">8. Resend</text>
<text x="75" y="470" class="b">9. ACK 3</text>

<rect x="1110" y="120" width="420" height="220" class="box"/>
<text x="1130" y="155" class="h">Key Ideas</text>
<text x="1130" y="190" class="b">• Sequence numbers</text>
<text x="1130" y="220" class="b">• ACK confirms delivery</text>
<text x="1130" y="250" class="b">• Timeout detects loss</text>
<text x="1130" y="280" class="b">• Retransmission ensures reliability</text>
</svg>