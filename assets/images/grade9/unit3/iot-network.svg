<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
text{font-family:Arial,sans-serif}
.title{font-size:34px;font-weight:bold}
.heading{font-size:22px;font-weight:bold}
.body{font-size:18px}
.device{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}
.cloud{fill:#eef6ff;stroke:#2563eb;stroke-width:3}
.line{stroke:#64748b;stroke-width:3}
</style>
</defs>

<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="title">Internet of Things (IoT)</text>

<ellipse cx="800" cy="180" rx="170" ry="65" class="cloud"/>
<text x="800" y="190" text-anchor="middle" class="heading">Internet</text>

<line x1="800" y1="245" x2="300" y2="420" class="line"/>
<line x1="800" y1="245" x2="650" y2="420" class="line"/>
<line x1="800" y1="245" x2="950" y2="420" class="line"/>
<line x1="800" y1="245" x2="1300" y2="420" class="line"/>

<rect x="180" y="420" width="240" height="120" class="device"/>
<text x="300" y="480" text-anchor="middle" class="heading">Smart Watch</text>

<rect x="530" y="420" width="240" height="120" class="device"/>
<text x="650" y="480" text-anchor="middle" class="heading">Smart Speaker</text>

<rect x="830" y="420" width="240" height="120" class="device"/>
<text x="950" y="480" text-anchor="middle" class="heading">Smart Light</text>

<rect x="1180" y="420" width="240" height="120" class="device"/>
<text x="1300" y="480" text-anchor="middle" class="heading">Security Camera</text>

<rect x="120" y="650" width="1360" height="160" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="160" y="695" class="heading">IoT Characteristics</text>
<text x="160" y="735" class="body">• Devices connect through the Internet</text>
<text x="160" y="765" class="body">• Sensors collect and share data automatically</text>
<text x="160" y="795" class="body">• Enables smart homes, smart cities and smart healthcare</text>

</svg>
