<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,sans-serif}
.title{font-size:34px;font-weight:bold}
.head{font-size:24px;font-weight:bold}
.body{font-size:17px}
.left{fill:#eef6ff;stroke:#2563eb;stroke-width:2}
.right{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}
</style></defs>
<rect width="1600" height="900" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="title">Symmetric vs Asymmetric Encryption</text>

<rect x="80" y="120" width="680" height="680" class="left"/>
<text x="420" y="170" text-anchor="middle" class="head">Symmetric Encryption</text>
<text x="120" y="230" class="body">✓ One shared secret key</text>
<text x="120" y="270" class="body">✓ Fast encryption and decryption</text>
<text x="120" y="310" class="body">✓ Good for large amounts of data</text>
<text x="120" y="350" class="body">✗ Secret key must be shared securely</text>

<rect x="250" y="430" width="340" height="180" fill="#ffffff" stroke="#2563eb"/>
<text x="420" y="475" text-anchor="middle" class="head">Shared Key</text>
<text x="420" y="515" text-anchor="middle" class="body">🔑 Same key</text>
<text x="420" y="550" text-anchor="middle" class="body">Encrypt</text>
<text x="420" y="580" text-anchor="middle" class="body">Decrypt</text>

<rect x="840" y="120" width="680" height="680" class="right"/>
<text x="1180" y="170" text-anchor="middle" class="head">Asymmetric Encryption</text>
<text x="880" y="230" class="body">✓ Uses two different keys</text>
<text x="880" y="270" class="body">✓ Public Key encrypts data</text>
<text x="880" y="310" class="body">✓ Private Key decrypts data</text>
<text x="880" y="350" class="body">✓ More secure key exchange</text>
<text x="880" y="390" class="body">✗ Slower than symmetric encryption</text>

<rect x="980" y="430" width="400" height="220" fill="#ffffff" stroke="#16a34a"/>
<text x="1180" y="475" text-anchor="middle" class="head">Key Pair</text>
<text x="1180" y="520" text-anchor="middle" class="body">🔓 Public Key → Encrypt</text>
<text x="1180" y="570" text-anchor="middle" class="body">🔒 Private Key → Decrypt</text>

<text x="800" y="860" text-anchor="middle" class="body">HTTPS uses both methods: asymmetric encryption to exchange keys, then symmetric encryption for fast communication.</text>
</svg>