<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
text{font-family:Arial,sans-serif}
.title{font-size:34px;font-weight:bold}
.head{font-size:22px;font-weight:bold}
.body{font-size:18px}
.packet{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:10}
.good{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}
</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
</marker>
</defs>

<rect width="1600" height="900" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="title">Packet Ordering with TCP</text>

<text x="120" y="120" class="head">Original Order</text>

<rect class="packet" x="120" y="150" width="140" height="70"/>
<text x="190" y="192" text-anchor="middle" class="body">Packet 1</text>

<rect class="packet" x="300" y="150" width="140" height="70"/>
<text x="370" y="192" text-anchor="middle" class="body">Packet 2</text>

<rect class="packet" x="480" y="150" width="140" height="70"/>
<text x="550" y="192" text-anchor="middle" class="body">Packet 3</text>

<rect class="packet" x="660" y="150" width="140" height="70"/>
<text x="730" y="192" text-anchor="middle" class="body">Packet 4</text>

<line x1="800" y1="185" x2="930" y2="185" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>

<text x="980" y="120" class="head">Arrival Order</text>

<rect class="packet" x="980" y="150" width="140" height="70"/>
<text x="1050" y="192" text-anchor="middle" class="body">Packet 3</text>

<rect class="packet" x="1160" y="150" width="140" height="70"/>
<text x="1230" y="192" text-anchor="middle" class="body">Packet 1</text>

<rect class="packet" x="1340" y="150" width="140" height="70"/>
<text x="1410" y="192" text-anchor="middle" class="body">Packet 4</text>

<rect class="packet" x="980" y="260" width="140" height="70"/>
<text x="1050" y="302" text-anchor="middle" class="body">Packet 2</text>

<text x="120" y="410" class="head">TCP Reorders Packets</text>

<line x1="800" y1="470" x2="930" y2="470" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>

<rect class="good" x="980" y="435" width="140" height="70"/>
<text x="1050" y="477" text-anchor="middle" class="body">Packet 1</text>

<rect class="good" x="1160" y="435" width="140" height="70"/>
<text x="1230" y="477" text-anchor="middle" class="body">Packet 2</text>

<rect class="good" x="1340" y="435" width="140" height="70"/>
<text x="1410" y="477" text-anchor="middle" class="body">Packet 3</text>

<rect class="good" x="1160" y="545" width="140" height="70"/>
<text x="1230" y="587" text-anchor="middle" class="body">Packet 4</text>

<rect x="120" y="650" width="1360" height="170" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

<text x="150" y="690" class="head">Key Idea</text>
<text x="150" y="730" class="body">• Packets may arrive in a different order because they travel along different network paths.</text>
<text x="150" y="765" class="body">• TCP uses sequence numbers to put packets back into the correct order.</text>
<text x="150" y="800" class="body">• The application receives the complete message in the original order.</text>

</svg>
