<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
text{font-family:Arial,sans-serif}
.title{font-size:34px;font-weight:bold;fill:#111827}
.h{font-size:22px;font-weight:bold}
.b{font-size:17px}
.mail{fill:#eef6ff;stroke:#2563eb;stroke-width:2}
.warn{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
.good{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}
</style>
</defs>

<rect width="100%" height="100%" fill="white"/>
<text x="800" y="55" text-anchor="middle" class="title">Phishing Email Example</text>

<rect x="90" y="110" width="1420" height="470" class="warn"/>

<text x="130" y="160" class="h">Inbox</text>

<rect x="140" y="200" width="1320" height="320" class="mail"/>

<text x="170" y="245" class="b"><tspan font-weight="bold">From:</tspan> support@secure-school-login.com</text>
<text x="170" y="285" class="b"><tspan font-weight="bold">Subject:</tspan> Your account will be closed today!</text>

<text x="170" y="345" class="b">Dear Student,</text>
<text x="170" y="380" class="b">Your school account has been suspended.</text>
<text x="170" y="415" class="b">Click the button below immediately to verify your password.</text>

<rect x="520" y="445" width="420" height="48" fill="#2563eb"/>
<text x="730" y="476" text-anchor="middle" font-family="Arial" font-size="18" fill="white">VERIFY ACCOUNT</text>

<text x="980" y="475" fill="#dc2626" font-size="18">⚠ Suspicious Link</text>

<rect x="90" y="630" width="1420" height="200" class="good"/>

<text x="120" y="675" class="h">Warning Signs</text>

<text x="120" y="720" class="b">• Urgent language ("today", "immediately")</text>
<text x="120" y="755" class="b">• Requests for passwords or personal information</text>
<text x="120" y="790" class="b">• Suspicious sender address or unfamiliar links</text>

<text x="820" y="720" class="b">• Check the sender carefully</text>
<text x="820" y="755" class="b">• Never share passwords by email</text>
<text x="820" y="790" class="b">• Report phishing messages to a teacher or administrator</text>

</svg>
